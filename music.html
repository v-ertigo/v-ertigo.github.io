			<div id="aWrap">

		<button id="aPlay" enabled><span id="aPlayIco" class="material-icons">

		<!-- (D) VOLUME SLIDE -->
		<span id="aVolIco" class="material-icons">&#128362</span>
		<input id="aVolume" type="range" min="0" max="1" value="1" step="0.1" disabled>
